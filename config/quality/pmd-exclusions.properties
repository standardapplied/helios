# PMD exclusions: fully.qualified.Class=Rule1,Rule2 (a nested class is Outer.Nested).
# Policy: CLAUDE.md, "Quality gate". An entry is never added to make a change pass; the code
# is fixed.
#
# Burn-down: every class and rule that violated when the gate was installed, generated from
# that first run. Entries may only be removed. Each heading is emptied by the follow-up spec
# named after it; the last one deletes this section.

# v3-quality-repl: repl
com.standardapplied.helios.repl.InputBindings=CognitiveComplexity
com.standardapplied.helios.repl.protocol.ProcessTransport=CognitiveComplexity,CyclomaticComplexity
com.standardapplied.helios.repl.sandbox.policy.PolicyBytecodeVerifier=CognitiveComplexity,CyclomaticComplexity

# v3-quality-tests: tests
com.standardapplied.helios.anthropic.AnthropicModelTest=NcssCount
com.standardapplied.helios.gemini.GeminiFilesClientTest.StubHttpClient=CouplingBetweenObjects
com.standardapplied.helios.gemini.StreamingIteratorTest=NcssCount
com.standardapplied.helios.openai.OpenAIModelTest=NcssCount
com.standardapplied.helios.repl.sandbox.IsolatedDeploymentTest=CognitiveComplexity
com.standardapplied.helios.session.SchemaParseSelfCorrectionReproTest.DeltaThenErrorModel=CognitiveComplexity
com.standardapplied.helios.session.files.LinuxFilesTest=CognitiveComplexity
com.standardapplied.helios.session.loop.AgentLoopTest=CouplingBetweenObjects
com.standardapplied.helios.session.loop.HookIntegrationTest=CouplingBetweenObjects

# Accepted. A follow-up spec moves an entry here only where its own text names the entry, and
# each entry is preceded by a comment line stating why.

# v3-deterministic-tests: newIdTimestampIsReasonable asserts that a UUID v7 embeds the current
# millisecond by bracketing it between two clock reads, the one assertion in the suite that
# needs the wall clock.
com.standardapplied.helios.core.common.IdsTest=ClockReadInTest

# v3-quality-core-tools: the provider SPI: blocking, iterator and publisher forms of two call
# shapes plus model identity. Reshaped by audit-session-streaming.
com.standardapplied.helios.core.model.Model=TooManyMethods
# v3-quality-core-tools: one flat provider-neutral configuration record; grouping its fields into
# sub-records was rejected for SessionOptions on ergonomic grounds and the same holds here.
com.standardapplied.helios.core.model.ModelConfig.Builder=TooManyFields
# v3-quality-core-tools: mirrors the persisted helios_traces row; grouping would not remove a
# column.
com.standardapplied.helios.core.trace.Trace.Builder=TooManyFields
# v3-quality-core-tools: one state machine; its transitions share invariants that splitting would
# scatter.
com.standardapplied.helios.core.fault.CircuitBreaker=TooManyMethods
# v3-quality-session: one typed entry point per hook phase; a generic dispatcher would lower the
# count by giving up compile-time phase typing.
com.standardapplied.helios.session.hooks.HookRegistry=CouplingBetweenObjects,TooManyMethods
# v3-quality-session: the public session API; each method is a distinct caller operation.
com.standardapplied.helios.session.AgentSession=TooManyMethods
# v3-quality-session: deleted by v3-append-only-compaction, which removes this entry.
com.standardapplied.helios.session.DropMiddleToolResultsCompactor=CognitiveComplexity,GodClass
