name: Release

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: maven-central-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    environment: live-providers
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache ONNX models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.helios/models
          key: onnx-models-pinned-${{ hashFiles('onnx/src/main/java/com/standardapplied/helios/onnx/OnnxModelId.java', 'onnx/src/main/java/com/standardapplied/helios/onnx/OnnxModelSpec.java') }}
          restore-keys: onnx-models-pinned-

      - name: Live tests
        run: ./mvnw -B verify -Dtest='*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false -Djacoco.skip=true -Dspotless.check.skip=true -Dpmd.skip=true -Dcpd.skip=true -Dcyclonedx.skip=true -fae
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-test-reports
          path: '**/target/surefire-reports/TEST-*.xml'

  deploy:
    needs: live
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Refuse to deploy a commit CI has not passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PASSED="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&branch=main&status=success&per_page=1" --jq '.total_count')"
          if ! [ "$PASSED" -gt 0 ]; then
            echo "::error::CI has no successful push run on main for commit ${GITHUB_SHA}; the deploy runs no tests, so it publishes only a main commit CI has passed."
            exit 1
          fi
          echo "CI passed on main at ${GITHUB_SHA}; proceeding."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Resolve project version
        id: version
        run: echo "version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Refuse to deploy an already-published version
        run: |
          V="${{ steps.version.outputs.version }}"
          URL="https://repo.maven.apache.org/maven2/com/standardapplied/helios-core/${V}/helios-core-${V}.pom"
          if curl -sfI "$URL" > /dev/null; then
            echo "::error::helios ${V} is already published to Maven Central — bump the version instead of re-releasing. Refusing to create a duplicate deployment."
            exit 1
          fi
          echo "helios ${V} is not on Maven Central yet; proceeding."

      - name: Refuse duplicated code
        run: ./mvnw -B pmd:aggregate-cpd@cpd pmd:aggregate-cpd-check@cpd-check

      - name: Deploy to Maven Central
        run: ./mvnw -B clean deploy -Prelease -DskipTests -Djacoco.skip=true -pl core,session,runtime,gemini,anthropic,openai,onnx,persistence,repl,testing,skills
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
