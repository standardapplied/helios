name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # An advisory published against an unchanged dependency is found by the next daily run.
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache ONNX models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.helios/models
          key: onnx-models-${{ hashFiles('onnx/src/main/java/com/standardapplied/helios/onnx/OnnxModelId.java', 'onnx/src/main/java/com/standardapplied/helios/onnx/OnnxModelSpec.java') }}
          restore-keys: onnx-models-

      - name: Build, test, gate coverage
        run: ./mvnw -B clean verify javadoc:jar

      - name: Upload dependency inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-inventory-${{ matrix.os }}
          path: '**/target/helios-*.cdx.json'
          if-no-files-found: error

      - name: Test the advisory scan
        run: python3 config/security/advisory_scan_test.py

      - name: Scan resolved dependencies for known advisories
        run: python3 config/security/advisory_scan.py target/helios-runtime.cdx.json target/helios-build.cdx.json

      - name: Refuse a build that changed the tree
        run: |
          CHANGED="$(git status --porcelain --untracked-files=all)"
          if [ -n "$CHANGED" ]; then
            echo "::error::The build changed the working tree; a build never rewrites or adds a file outside an ignored path."
            echo "$CHANGED"
            exit 1
          fi
