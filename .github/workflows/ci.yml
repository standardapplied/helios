name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # An advisory published against an unchanged dependency is found by the next daily run.
  schedule:
    - cron: '23 5 * * *'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: ~/.helios/models
          key: onnx-models-${{ hashFiles('onnx/src/main/java/com/standardapplied/helios/onnx/OnnxModelId.java', 'onnx/src/main/java/com/standardapplied/helios/onnx/OnnxModelSpec.java') }}
          restore-keys: onnx-models-

      - name: Build, test, gate coverage
        run: mvn -B clean verify javadoc:jar

      - name: Upload dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: dependency-inventory-${{ matrix.os }}
          path: '**/target/helios-*.cdx.json'
          if-no-files-found: error

      - name: Test the advisory scan
        run: python3 config/security/advisory_scan_test.py

      - name: Scan resolved dependencies for known advisories
        run: python3 config/security/advisory_scan.py target/helios-runtime.cdx.json target/helios-build.cdx.json
